<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#A5D6A7" />
<title>小煎蛋的工作台</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <!-- 左侧导航栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🍳</div>
      <div class="brand-text">
        <div class="brand-title">小煎蛋</div>
        <div class="brand-sub">个人工作台</div>
      </div>
    </div>

    <nav class="nav" id="nav"><!-- 由 JS 渲染 --></nav>

    <div class="sidebar-foot">
      <button class="side-btn" id="addSectionBtn">＋ 添加板块</button>
      <button class="side-btn ghost" id="settingsBtn">⚙ 设置 / 数据</button>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button class="hamb" id="hambBtn" aria-label="菜单">☰</button>
      <div class="topbar-title">
        <h1 id="pageTitle">工作</h1>
        <p id="pageDate" class="page-date"></p>
      </div>
      <div class="topbar-right">
        <span class="streak-pill" id="globalStreak" title="连续打卡"></span>
      </div>
    </header>

    <section class="view" id="view"><!-- 由 JS 渲染 --></section>
  </main>
</div>

<!-- 遮罩（移动端抽屉） -->
<div class="scrim" id="scrim"></div>

<!-- 弹窗容器 -->
<div class="modal-root" id="modalRoot"></div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script src="js/app.js?v=20260902e"></script>
</body>
</html>
